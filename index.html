<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسجد امام رضا (ع) | مدیریت هوشمند</title>
    <style>
        :root {
            --gold: #facc15;
            --gold-light: #fefce8;
            --bg-dark: #18181b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #e4e4e7;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #3f3f46 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ذرات طلایی */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            animation: floatParticle 20s linear infinite;
            opacity: 0.4;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(250, 204, 21, 0.4) inset;
            animation: cardGlow 3s infinite alternate;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        @keyframes cardGlow {
            0% { box-shadow: 0 20px 45px rgba(0,0,0,0.6), 0 0 0 1.5px rgba(250,204,21,0.4) inset; }
            100% { box-shadow: 0 20px 45px rgba(0,0,0,0.6), 0 0 0 1.5px rgba(254,252,232,0.55) inset; }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            30%, 70% { transform: translateX(4px); }
            50% { transform: translateX(-4px); }
        }

        input, select, textarea, button {
            font-family: inherit;
            font-size: 1rem;
            min-height: 48px;
            border-radius: 14px;
            border: 1.5px solid rgba(250, 204, 21, 0.3);
            background: rgba(10, 10, 18, 0.7);
            color: var(--text);
            padding: 0 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
            margin: 6px 0;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
        }
        button {
            background: linear-gradient(145deg, #1e1e2a, #0f0f18);
            border: 1.5px solid #a67c00;
            color: var(--gold-light);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        button:hover {
            background: #2a2a38;
            border-color: var(--gold-light);
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.96);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 30px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .role-title {
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 10px 14px;
            border-radius: 30px;
            color: #ddd;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            flex: 1 1 auto;
        }
        .tab-btn.active {
            background: #a67c00;
            color: #fff;
            border-color: var(--gold-light);
            box-shadow: 0 0 18px var(--gold-light);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            margin: 12px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
            background: rgba(0, 0, 0, 0.35);
        }
        th, td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(250, 204, 21, 0.2);
        }

        .attendance-select.present { background: #166534; color: #bbf7d0; border-color: #22c55e; }
        .attendance-select.excused { background: #5c4a1e; color: #fde68a; border-color: #eab308; }
        .attendance-select.absent { background: #5c1e1e; color: #fecaca; border-color: #ef4444; }

        .warning-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(180, 180, 190, 0.3);
            border: 1.5px solid #888;
            display: inline-block;
            margin: 0 3px;
            cursor: pointer;
            transition: 0.2s;
        }
        .warning-dot.filled {
            background: #ef4444;
            border-color: #fecaca;
            box-shadow: 0 0 10px #ef4444;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            border: 1.5px solid var(--gold);
            border-radius: 28px;
            padding: 22px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 480px) {
            .glass-card { padding: 16px; }
            button { font-size: 0.9rem; padding: 10px; }
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="particles" id="particlesContainer"></div>
    <div id="app" class="glass-card" style="max-width: 650px;"></div>

    <script>
        // ---------- داده‌های اولیه ----------
        const DEFAULT_USERS = [
            { phone: '09940793678', code: '102211', role: 'attendance', name: 'مسئول حضور و غیاب' },
            { phone: '09173487826', code: '1962376', role: 'supervisor', name: 'مسئول نظارت' },
            { phone: '09165327073', code: '1966037', role: 'owner', name: 'مالک' }
        ];
        const DEFAULT_PERSONS = ['شخص ۱', 'شخص ۲', 'شخص ۳', 'شخص ۴', 'شخص ۵', 'شخص ۶', 'شخص ۷', 'شخص ۸', 'شخص ۹', 'شخص ۱۰'];
        const DEFAULT_TASKS = [
            { title: 'مسئول PS5', items: ['نظم وسایل','نظافت وسایل','حفاظت از اموال','مدیریت استفاده از دستگاه','شارژ شدن به موقع دسته‌ها','مدیریت زمان استفاده از دستگاه','نظافت تلویزیون','نظم کابل‌های دستگاه'] },
            { title: 'مسئول سیستم صوتی', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','تحویل به موقع میکروفن','تنظیم پایه میکروفن','نظم سیم‌ها و گذاشتن آن‌ها زیر قالی','خاموش و روشن کردن به موقع سیستم صوتی','نظم کمد سیستم'] },
            { title: 'مسئول خرید', items: ['به موقع خریدن وسایل'] },
            { title: 'مسئول مسجد', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','کتابخانه','نظافت پنجره','کولر و پنکه','بوی بد ندادن مسجد','سطل زباله','نظم دمپایی و کفش‌ها','نظافت درون و برون','نظم نمازگزاران','جابه‌جا نشدن صندلی‌ها','خاموش و روشن کردن چراغ‌ها'] },
            { title: 'مسئول کانون', items: ['نظم وسایل کانون','کنترل رفت و آمد','حفاظت از اموال','چراغ‌های بیرون','نظافت درون و برون','نظم دمپایی و کفش‌ها','نظم بازی‌های فکری','نظم کتاب‌های کتابخانه','نظافت پنجره‌های کانون','جایزه‌ها','آبرسانی به گل و گیاهان','خالی کردن سطل زباله','تأمین امنیت یخچال','کولر','بو ندادن اتاق','کنترل شوخی‌های فیزیکی'] },
            { title: 'مسئول هیئت', items: ['نظم سینه‌زنان و وسایل','هماهنگی تدارکات','سیستم صوتی'] },
            { title: 'مسئول مکبری', items: ['به وقت رفتن مکبر','نداشتن غلط و تپق مکبر','پرت نشدن حواس مکبر'] },
            { title: 'مسئول آشپزخانه', items: ['حفاظت از وسایل','تحویل به موقع وسایل','نظافت وسایل','نظم وسایل','کنترل ورود و خروج','بوی بد ندادن اتاق','سطل زباله','جابه‌جا نشدن صندلی‌ها'] },
            { title: 'مسئول تدارکات', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','تحویل به موقع','کنترل ورود و خروج','بوی بد ندادن اتاق','کولر','نظم دمپایی و کفش‌ها','نظافت درون و برون زینبیه','نظافت پنجره‌های تدارکات'] },
            { title: 'مسئول هماهنگی', items: ['نظم در هماهنگی'] },
            { title: 'مسئول رسانه', items: ['نظم وسایل','کنترل استفاده از اموال','حفاظت از اموال','نظافت وسایل','جا به جا نشدن وسایل','نظم سیم‌های برق و اطلاعات کامپیوتر','حفاظت از اطلاعات درون کامپیوتر'] },
            { title: 'مسئول اتاق رسانه', items: ['نظافت اتاق','حفاظت از وسایل اتاق','قالی کردن سطل زباله','نظافت پنجره','منظم بودن وسایل','کولر','کنترل رفت و آمد','منظم بودن عکس‌ها','منظم بودن صندلی‌ها','منظم بودن کمد','بوی بد ندادن'] },
            { title: 'مسئول ورزش', items: ['حفاظت از وسایل','تحویل به موقع وسایل','نظافت وسایل','نظم وسایل','کنترل ورود و خروج در اتاق','ساقی بودن','ترمیم وسایل','نظم کتاب‌های کتابخانه'] },
            { title: 'مسئول VR', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','شارژ داشتن وسیله‌ها'] },
            { title: 'مسئول عکاسی', items: ['شارژ بودن وسایل عکاسی','سر وقت عکاسی کردن','آپلود به موقع گزارش'] },
            { title: 'مسئول حضور غیاب', items: ['حضور به موقع','نظم در حضور زدن','فاش نکردن اطلاعات','تحویل به موقع به مسئول حلقه'] }
        ];

        // localStorage helpers
        const get = (key, def) => { try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : def; } catch(e) { return def; } };
        const set = (key, val) => localStorage.setItem(key, JSON.stringify(val));

        // state
        let currentUser = null;
        let users = get('users', DEFAULT_USERS);
        let persons = get('persons', DEFAULT_PERSONS);
        let attendance = get('attendance', {});
        let tasks = get('tasks', DEFAULT_TASKS);
        let warnings = get('warnings', {});
        let messages = get('messages', []);

        const app = document.getElementById('app');

        // ذرات
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
                p.style.animationDuration = (15 + Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }

        // رندر صفحه ورود
        function renderLogin(step = 1, phone = '', error = '') {
            app.className = 'glass-card fade-in';
            app.style.maxWidth = '500px';
            app.innerHTML = `
                <h2 style="color:var(--gold-light); text-align:center; margin-bottom:20px;">🌟 ورود به سامانه مسجد</h2>
                ${step === 1 ? `
                    <div>
                        <label>📱 شماره تلفن</label>
                        <input type="tel" id="phoneInput" placeholder="شماره خود را وارد کنید" value="${phone}" autofocus>
                        <div style="color:var(--danger); font-size:0.9rem;">${error}</div>
                        <button onclick="loginStep1()" style="width:100%; margin-top:16px;">مرحله بعد</button>
                    </div>
                ` : `
                    <div>
                        <label>🔐 کد مسئولیت</label>
                        <input type="password" id="codeInput" maxlength="7" placeholder="کد مسئولیت را وارد کنید" autofocus>
                        <div style="color:var(--danger); font-size:0.9rem;">${error}</div>
                        <button onclick="loginStep2('${phone}')" style="width:100%; margin-top:16px;">ورود</button>
                        <button onclick="renderLogin(1,'${phone}')" style="width:100%; margin-top:8px; background:transparent;">بازگشت</button>
                    </div>
                `}
            `;
            if (step === 1) document.getElementById('phoneInput')?.addEventListener('keypress', e => e.key === 'Enter' && loginStep1());
            if (step === 2) document.getElementById('codeInput')?.addEventListener('keypress', e => e.key === 'Enter' && loginStep2(phone));
        }

        window.loginStep1 = function() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!users.find(u => u.phone === phone)) {
                app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 500);
                return renderLogin(1, phone, '⛔ شماره مجاز نیست');
            }
            renderLogin(2, phone);
        };

        window.loginStep2 = function(phone) {
            const code = document.getElementById('codeInput').value.trim();
            const user = users.find(u => u.phone === phone && u.code === code);
            if (!user) {
                app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 500);
                return renderLogin(2, phone, '⛔ کد اشتباه است');
            }
            currentUser = user;
            renderDashboard();
        };

        function logout() {
            currentUser = null;
            renderLogin(1);
        }

        function sendMessageModal() {
            const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3 style="color:var(--gold-light); margin-bottom:12px;">📩 ارسال پیام به مدیریت</h3>
                    <textarea id="msgText" rows="4" placeholder="پیام شما..."></textarea>
                    <div style="display:flex; gap:10px; margin-top:14px;">
                        <button onclick="submitMessage()">ارسال</button>
                        <button onclick="this.closest('.modal-overlay').remove()">انصراف</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            document.getElementById('msgText').focus();
        }
        window.submitMessage = function() {
            const text = document.getElementById('msgText')?.value.trim();
            if (!text) return;
            messages.push({ from: currentUser.name, text, date: new Date().toLocaleDateString('fa-IR') });
            set('messages', messages);
            document.querySelector('.modal-overlay')?.remove();
            alert('✅ پیام ارسال شد.');
        };

        // رندر پنل بر اساس نقش
        function renderDashboard() {
            if (!currentUser) return renderLogin(1);
            const role = currentUser.role;
            app.className = 'glass-card fade-in';
            app.style.maxWidth = (role === 'owner' || role === 'manager') ? '700px' : '600px';
            app.style.padding = '18px';

            let topBar = `
                <div class="top-bar">
                    <span class="role-title">${currentUser.name}</span>
                    <div style="display:flex; gap:8px;">
                        <button onclick="sendMessageModal()" title="ارسال پیام">📩</button>
                        <button onclick="logout()" title="خروج">🚪</button>
                    </div>
                </div>`;

            if (role === 'attendance') renderAttendancePanel(topBar);
            else if (role === 'supervisor') renderSupervisorPanel(topBar);
            else if (role === 'owner' || role === 'manager') renderAdminPanel(topBar);
        }

        // پنل حضور و غیاب
        function renderAttendancePanel(topBar) {
            app.innerHTML = topBar + `
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>نام</th><th>مغرب</th><th>عشا</th></tr></thead>
                        <tbody id="attendanceBody"></tbody>
                    </table>
                </div>
                <button onclick="saveAttendance()" style="width:100%; margin-top:14px;">💾 ذخیره وضعیت</button>`;
            const tbody = document.getElementById('attendanceBody');
            persons.forEach(p => {
                const att = attendance[p] || { maghreb: '', isha: '' };
                tbody.innerHTML += `<tr>
                    <td>${p}</td>
                    <td><select class="attendance-select" data-person="${p}" data-prayer="maghreb">
                        <option value="">--</option>
                        <option value="present" ${att.maghreb === 'present' ? 'selected' : ''}>✅ حضور</option>
                        <option value="excused" ${att.maghreb === 'excused' ? 'selected' : ''}>🟡 موجه</option>
                        <option value="absent" ${att.maghreb === 'absent' ? 'selected' : ''}>❌ غیبت</option>
                    </select></td>
                    <td><select class="attendance-select" data-person="${p}" data-prayer="isha">
                        <option value="">--</option>
                        <option value="present" ${att.isha === 'present' ? 'selected' : ''}>✅ حضور</option>
                        <option value="excused" ${att.isha === 'excused' ? 'selected' : ''}>🟡 موجه</option>
                        <option value="absent" ${att.isha === 'absent' ? 'selected' : ''}>❌ غیبت</option>
                    </select></td>
                </tr>`;
            });
            document.querySelectorAll('.attendance-select').forEach(sel => {
                sel.addEventListener('change', function() {
                    updateSelectColor(this);
                    const person = this.dataset.person, prayer = this.dataset.prayer;
                    if (!attendance[person]) attendance[person] = { maghreb: '', isha: '' };
                    attendance[person][prayer] = this.value;
                });
                updateSelectColor(sel);
            });
        }

        function updateSelectColor(sel) {
            sel.classList.remove('present', 'excused', 'absent');
            if (sel.value === 'present') sel.classList.add('present');
            else if (sel.value === 'excused') sel.classList.add('excused');
            else if (sel.value === 'absent') sel.classList.add('absent');
        }
        window.saveAttendance = function() {
            set('attendance', attendance);
            alert('✅ وضعیت نماز ذخیره شد.');
        };

        // پنل نظارت
        function renderSupervisorPanel(topBar) {
            app.innerHTML = topBar + `<div id="tasksContainer" style="display:flex; flex-direction:column; gap:16px;"></div>`;
            const container = document.getElementById('tasksContainer');
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.style.padding = '14px';
                card.innerHTML = `
                    <h4 style="color:var(--gold-light); margin-bottom:8px;">${task.title}</h4>
                    <div>${task.items.map(item => {
                        const key = `${task.title}|${item}`;
                        const warnArr = warnings[key] || [];
                        let dots = '';
                        for (let j = 0; j < 5; j++) {
                            dots += `<span class="warning-dot ${j < warnArr.length ? 'filled' : ''}" data-key="${key}" data-index="${j}"></span>`;
                        }
                        return `<div style="display:flex; justify-content:space-between; margin:8px 0; align-items:center;">
                            <span style="flex:1; font-size:0.9rem;">${item}</span>
                            <span>${dots}</span>
                        </div>`;
                    }).join('')}</div>`;
                container.appendChild(card);
            });
            // Event delegation for dots
            document.querySelectorAll('.warning-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const key = this.dataset.key;
                    const idx = parseInt(this.dataset.index);
                    const warnArr = warnings[key] || [];
                    if (idx < warnArr.length) {
                        alert(`📅 تاریخ: ${warnArr[idx].date}\n📝 دلیل: ${warnArr[idx].reason}`);
                    } else if (idx === warnArr.length) {
                        showWarningModal(key);
                    }
                });
            });
        }

        function showWarningModal(key) {
            const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3 style="color:var(--gold-light); margin-bottom:12px;">⚠️ ثبت اخطار جدید</h3>
                    <input type="date" id="warnDate"><br>
                    <textarea id="warnReason" placeholder="دلیل اخطار..."></textarea>
                    <div style="display:flex; gap:10px; margin-top:14px;">
                        <button onclick="submitWarning('${key}')">ثبت</button>
                        <button onclick="this.closest('.modal-overlay').remove()">انصراف</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
        }
        window.submitWarning = function(key) {
            const date = document.getElementById('warnDate')?.value;
            const reason = document.getElementById('warnReason')?.value.trim();
            if (!date || !reason) return alert('لطفاً تاریخ و دلیل را وارد کنید.');
            if (!warnings[key]) warnings[key] = [];
            if (warnings[key].length >= 5) return alert('حداکثر ۵ اخطار مجاز است.');
            warnings[key].push({ date, reason });
            set('warnings', warnings);
            document.querySelector('.modal-overlay')?.remove();
            renderDashboard();
        };

        // پنل مدیریت (مالک/مدیر)
        function renderAdminPanel(topBar) {
            const isOwner = currentUser.role === 'owner';
            app.innerHTML = topBar + `
                <div class="tabs">
                    <button class="tab-btn active" data-tab="persons">👥 اشخاص</button>
                    <button class="tab-btn" data-tab="responsibilities">📜 مسئولیت‌ها</button>
                    <button class="tab-btn" data-tab="warnings">⚠️ اخطارها</button>
                    <button class="tab-btn" data-tab="messages">📩 پیام‌ها</button>
                    ${isOwner ? '<button class="tab-btn" data-tab="users">👤 کاربران</button>' : ''}
                </div>
                <div id="tabContent" class="fade-in"></div>`;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderTab(this.dataset.tab);
                });
            });
            renderTab('persons');
        }

        function renderTab(tab) {
            const content = document.getElementById('tabContent');
            switch(tab) {
                case 'persons': renderPersonsTab(content); break;
                case 'responsibilities': renderResponsibilitiesTab(content); break;
                case 'warnings': renderWarningsTab(content); break;
                case 'users': renderUsersTab(content); break;
                case 'messages': renderMessagesTab(content); break;
            }
        }

        function renderPersonsTab(container) {
            container.innerHTML = `
                <h4 style="margin-bottom:10px;">لیست اشخاص</h4>
                <div style="display:flex; gap:8px;">
                    <input id="newPersonName" placeholder="نام جدید">
                    <button onclick="addPerson()">➕ افزودن</button>
                </div>
                <div id="personsList" style="margin-top:12px;"></div>`;
            const list = document.getElementById('personsList');
            persons.forEach((p, idx) => {
                list.innerHTML += `<div style="display:flex; justify-content:space-between; background:rgba(255,255,255,0.05); padding:8px; margin:4px 0; border-radius:12px;">
                    <span>${p}</span>
                    <div>
                        <button onclick="editPerson(${idx})">✏️</button>
                        <button onclick="deletePerson(${idx})">🗑️</button>
                    </div>
                </div>`;
            });
        }
        window.addPerson = () => {
            const name = document.getElementById('newPersonName')?.value.trim();
            if (!name) return;
            persons.push(name);
            set('persons', persons);
            renderTab('persons');
        };
        window.editPerson = (idx) => {
            const name = prompt('نام جدید:', persons[idx]);
            if (name) { persons[idx] = name; set('persons', persons); renderTab('persons'); }
        };
        window.deletePerson = (idx) => {
            if (confirm('حذف این شخص؟')) { persons.splice(idx, 1); set('persons', persons); renderTab('persons'); }
        };

        function renderResponsibilitiesTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">مدیریت مسئولیت‌ها</h4>
                <button onclick="addResponsibility()">➕ افزودن مسئولیت</button>
                <div id="respList" style="margin-top:12px;"></div>`;
            const list = document.getElementById('respList');
            tasks.forEach((t, tIdx) => {
                const div = document.createElement('div');
                div.className = 'glass-card'; div.style.padding = '12px'; div.style.margin = '8px 0';
                div.innerHTML = `
                    <strong style="color:var(--gold-light);">${t.title}</strong>
                    <button onclick="editRespTitle(${tIdx})">✏️</button>
                    <button onclick="deleteResp(${tIdx})">🗑️</button>
                    <ul style="list-style:none; padding:0;">
                        ${t.items.map((it, iIdx) => `<li style="display:flex; justify-content:space-between; margin:4px 0;">${it}
                            <div>
                                <button onclick="editTaskItem(${tIdx},${iIdx})">✏️</button>
                                <button onclick="deleteTaskItem(${tIdx},${iIdx})">🗑️</button>
                            </div>
                        </li>`).join('')}
                    </ul>
                    <button onclick="addTaskItem(${tIdx})" style="margin-top:8px; width:100%;">➕ افزودن وظیفه</button>`;
                list.appendChild(div);
            });
        }
        window.addResponsibility = () => {
            const title = prompt('عنوان مسئولیت جدید:');
            if (title) { tasks.push({ title, items: [] }); set('tasks', tasks); renderTab('responsibilities'); }
        };
        window.editRespTitle = (idx) => { const t = prompt('عنوان جدید:', tasks[idx].title); if (t) { tasks[idx].title = t; set('tasks', tasks); renderTab('responsibilities'); } };
        window.deleteResp = (idx) => { if (confirm('حذف شود؟')) { tasks.splice(idx, 1); set('tasks', tasks); renderTab('responsibilities'); } };
        window.addTaskItem = (idx) => { const item = prompt('وظیفه جدید:'); if (item) { tasks[idx].items.push(item); set('tasks', tasks); renderTab('responsibilities'); } };
        window.editTaskItem = (tIdx, iIdx) => { const it = prompt('ویرایش:', tasks[tIdx].items[iIdx]); if (it) { tasks[tIdx].items[iIdx] = it; set('tasks', tasks); renderTab('responsibilities'); } };
        window.deleteTaskItem = (tIdx, iIdx) => { if (confirm('حذف وظیفه؟')) { tasks[tIdx].items.splice(iIdx, 1); set('tasks', tasks); renderTab('responsibilities'); } };

        function renderWarningsTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">⚠️ اخطارهای ثبت شده</h4>`;
            const allWarns = Object.entries(warnings);
            if (allWarns.length === 0) container.innerHTML += '<p>هیچ اخطاری وجود ندارد.</p>';
            allWarns.forEach(([key, arr]) => {
                arr.forEach((w, i) => {
                    container.innerHTML += `<div class="glass-card" style="padding:10px; margin:6px 0;">
                        📌 ${key} | 📅 ${w.date} | دلیل: ${w.reason}
                        <button onclick="deleteWarning('${key}',${i})">🗑️</button>
                    </div>`;
                });
            });
        }
        window.deleteWarning = (key, idx) => {
            warnings[key].splice(idx, 1);
            if (warnings[key].length === 0) delete warnings[key];
            set('warnings', warnings);
            renderTab('warnings');
        };

        function renderUsersTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">👤 مدیریت کاربران</h4><div id="userList"></div>
                <div style="margin-top:16px; padding:12px; background:rgba(0,0,0,0.3); border-radius:14px;">
                    <h5>افزودن مدیر جدید</h5>
                    <input id="newMgrPhone" placeholder="شماره تلفن">
                    <input id="newMgrCode" placeholder="کد ۷ رقمی">
                    <button onclick="addManager()">➕ افزودن مدیر</button>
                </div>`;
            const list = document.getElementById('userList');
            users.forEach((u, idx) => {
                list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:8px; margin:6px 0; border-radius:12px;">
                    <div>
                        <strong>${u.name}</strong> (${u.role})<br>
                        <small>📞 ${u.phone} | 🔐 ${u.code}</small>
                    </div>
                    <button onclick="editUser(${idx})">✏️</button>
                    ${u.role === 'manager' ? `<button onclick="deleteUser(${idx})">🗑️</button>` : ''}
                </div>`;
            });
        }
        window.editUser = (idx) => {
            const phone = prompt('شماره جدید:', users[idx].phone);
            const code = prompt('کد جدید:', users[idx].code);
            if (phone && code) { users[idx].phone = phone; users[idx].code = code; set('users', users); renderTab('users'); }
        };
        window.deleteUser = (idx) => { if (confirm('حذف این مدیر؟')) { users.splice(idx, 1); set('users', users); renderTab('users'); } };
        window.addManager = () => {
            const phone = document.getElementById('newMgrPhone')?.value.trim();
            const code = document.getElementById('newMgrCode')?.value.trim();
            if (!phone || !code) return;
            users.push({ phone, code, role: 'manager', name: 'مدیر' });
            set('users', users);
            renderTab('users');
        };

        function renderMessagesTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">📩 پیام‌های دریافتی</h4>`;
            if (messages.length === 0) container.innerHTML += '<p>پیامی وجود ندارد.</p>';
            messages.forEach((m, i) => {
                container.innerHTML += `<div class="glass-card" style="padding:10px; margin:6px 0;">
                    👤 ${m.from} | ${m.date}<br>${m.text}
                    <button onclick="deleteMsg(${i})">🗑️</button>
                </div>`;
            });
        }
        window.deleteMsg = (i) => { messages.splice(i, 1); set('messages', messages); renderTab('messages'); };

        // start
        createParticles();
        renderLogin(1);
    </script>
</body>
</html>
